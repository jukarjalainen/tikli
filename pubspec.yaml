name: tikli
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  equatable: ^2.0.5
  flutter_bloc: ^9.0.0
  flutter_map: ^7.0.2
  intl: ^0.19.0
  latlong2: ^0.9.1
  geolocator: ^10.1.0
  http: ^1.2.1
  material_design_icons_flutter: ^7.0.7296
  sqflite: ^2.4.2
  path: ^1.9.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/species.json
    - assets/data/all_finnish_birds.json

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/tikli_logo.png"
  web:
    generate: true
    image_path: "assets/icon/tikli_logo.png"
  macos:
    generate: true
    image_path: "assets/icon/tikli_logo.png"
  windows:
    generate: true
    image_path: "assets/icon/tikli_logo.png"
